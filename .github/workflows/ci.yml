name: Test and audit
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test,pdf,socks,audit]'
      - name: Syntax, style and security lint
        run: |
          python -m compileall -q shadowscan
          ruff check shadowscan --select S,E4,E7,E9,F
      - name: Tests
        run: pytest -q -W error
      - name: Runtime dependency advisories
        run: pip-audit -r requirements.txt --vulnerability-service pypi --progress-spinner off
