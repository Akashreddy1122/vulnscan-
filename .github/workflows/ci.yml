name: Test and audit
on:
  push:
    branches: ['arena/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test,pdf,socks,audit]'
      - name: Syntax, style and security lint
        run: |
          python -m compileall -q shadowscan
          ruff check shadowscan --select S,E4,E7,E9,F
      - name: Tests
        run: |
          if ! pytest -q -W error > pytest-output.txt 2>&1; then
            tail -n 80 pytest-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          cat pytest-output.txt
      - name: Runtime dependency advisories
        run: pip-audit -r requirements.txt --vulnerability-service pypi --progress-spinner off
