# Malware Scan — single-host deployment.
# Only the web tier is published. The API is reachable only inside the compose
# network; the web tier proxies /api/* to it (no browser-side API exposure).
name: malware-scan

services:
  api:
    build:
      context: ../backend
    image: malware-scan/api:1.0.0
    env_file: .env
    environment:
      MALWARESCAN_DATA: /data
    volumes:
      - msdata:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../frontend
    image: malware-scan/web:1.0.0
    environment:
      MALWARESCAN_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MALWARESCAN_WEB_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  msdata:
